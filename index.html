<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamil Food Explorer | Filters</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Noto+Sans+Tamil:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #e0eafc;
            --text: #2d3436;
            --accent: #d4af37;
            --shadow-light: #ffffff;
            --shadow-dark: #b8c6db;
        }

        body {
            background: var(--bg);
            font-family: 'Montserrat', 'Noto Sans Tamil', sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: var(--accent); }

        /* Filter Buttons Section */
        .filter-container {
            display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; justify-content: center;
        }

        .filter-btn {
            padding: 10px 20px; border: none; border-radius: 50px;
            background: var(--bg); cursor: pointer; font-weight: bold;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            transition: 0.3s; color: #555;
        }

        .filter-btn:active, .filter-btn.active {
            box-shadow: inset 3px 3px 7px var(--shadow-dark), inset -3px -3px 7px var(--shadow-light);
            color: var(--accent);
        }

        .search-area {
            width: 100%; max-width: 500px; display: flex; gap: 10px; margin-bottom: 30px;
        }

        input {
            flex: 1; padding: 15px; border: none; border-radius: 15px;
            background: var(--bg); box-shadow: inset 5px 5px 10px var(--shadow-dark);
            outline: none;
        }

        #recipeGrid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px; width: 100%; max-width: 1100px;
        }

        .card {
            background: var(--bg); padding: 20px; border-radius: 25px;
            box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light);
        }

        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 15px; }
        .tag { font-size: 0.7rem; font-weight: bold; background: var(--accent); color: white; padding: 3px 10px; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🥘 Food Explorer</h1>
    </div>

    <div class="filter-container">
        <button class="filter-btn" onclick="filterBy('All')">எல்லாம்</button>
        <button class="filter-btn" onclick="filterBy('Veg')">சைவம் (Veg)</button>
        <button class="filter-btn" onclick="filterBy('Non-Veg')">அசைவம் (Non-Veg)</button>
        <button class="filter-btn" onclick="filterBy('Sweet')">இனிப்பு (Sweet)</button>
    </div>

    <div class="search-area">
        <input type="text" id="userInput" placeholder="உணவு பெயரை தட்டச்சு செய்க...">
        <button class="filter-btn" onclick="getRecipes()">தேடு</button>
    </div>

    <div id="recipeGrid"></div>

    <script>
        const recipeGrid = document.getElementById('recipeGrid');
        
        // English-to-Tamil Category Mapper
        const translateCat = (eng) => {
            const map = {
                "Chicken": "கோழி வகை", "Beef": "மாட்டுக்கறி", "Dessert": "இனிப்பு வகை",
                "Vegetarian": "சைவம்", "Seafood": "கடல் உணவு", "Pork": "பன்றி இறைச்சி",
                "Lamb": "ஆட்டுக்கறி", "Side": "கூட்டு/பொரியல்", "Pasta": "பாஸ்தா"
            };
            return map[eng] || "மற்றவை";
        };

        const tamilDB = [
            { name: "சிக்கன் பிரியாணி", cat: "Non-Veg", img: "https://www.themealdb.com/images/media/meals/1529446352.jpg", desc: "காரசாரமான அசல் ஆம்பூர் பிரியாணி." },
            { name: "முருங்கைக்காய் சாம்பார்", cat: "Veg", img: "https://www.themealdb.com/images/media/meals/wvpsxx1468256321.jpg", desc: "வீட்டு முறையில் செய்த பருப்பு சாம்பார்." },
            { name: "ரவா கேசரி", cat: "Sweet", img: "https://www.themealdb.com/images/media/meals/1529445136.jpg", desc: "நெய் மணம் கமழும் இனிப்பு கேசரி." }
            // ... neenga munnadi vachiruntha matha recipes-um inga add pannikalam
        ];

        window.onload = () => renderList(tamilDB);

        // 2. Filter Function
        function filterBy(category) {
            if(category === 'All') {
                renderList(tamilDB);
            } else {
                const filtered = tamilDB.filter(item => item.cat === category);
                renderList(filtered);
            }
        }

        function renderList(meals) {
            recipeGrid.innerHTML = "";
            meals.forEach(m => {
                recipeGrid.innerHTML += `
                    <div class="card">
                        <span class="tag">${m.cat}</span>
                        <img src="${m.img}">
                        <h3>${m.name}</h3>
                        <p>${m.desc}</p>
                    </div>`;
            });
        }

        // 3. API Translation Logic
        async function getRecipes() {
            const query = document.getElementById('userInput').value.toLowerCase().trim();
            if (!query) return;

            recipeGrid.innerHTML = "தேடுகிறது...";

            try {
                const res = await fetch(`https://www.themealdb.com/api/json/v1/1/search.php?s=${query}`);
                const data = await res.json();
                
                recipeGrid.innerHTML = "";
                if (data.meals) {
                    data.meals.forEach(meal => {
                        recipeGrid.innerHTML += `
                            <div class="card">
                                <span class="tag">${translateCat(meal.strCategory)}</span>
                                <img src="${meal.strMealThumb}">
                                <h3>${meal.strMeal} (ஆங்கிலம்)</h3>
                                <p>${meal.strInstructions.substring(0, 100)}...</p>
                            </div>`;
                    });
                } else {
                    recipeGrid.innerHTML = "உணவு கிடைக்கவில்லை!";
                }
            } catch (e) { recipeGrid.innerHTML = "Error!"; }
        }
    </script>
</body>
</html>
